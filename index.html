<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>ClasseQCM — Créez, partagez, évaluez</title>
<style>
:root{--teal:#087f70;--teal2:#0b9b86;--ink:#202b2a;--muted:#687573;--line:#dce6e3;--bg:#f4f8f7;--white:#fff;--red:#b83a42;--green:#287a55;--shadow:0 10px 30px #163d3510}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--teal);color:white}button:hover{filter:brightness(1.06)}button.secondary{background:#e7f2ef;color:var(--teal)}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button.danger{background:#fff0f0;color:var(--red)}button.small{padding:7px 10px;font-size:13px;border-radius:9px}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.topin{max-width:1180px;margin:auto;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:900;letter-spacing:-.7px;color:var(--teal)}.brand span{color:var(--ink)}.wrap{max-width:1180px;margin:28px auto;padding:0 20px}.hero{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.hero h1{font-size:clamp(25px,4vw,36px);line-height:1.1;margin:0 0 8px}.muted{color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.tab{background:#e8efed;color:#52605d}.tab.active{background:var(--teal);color:#fff}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-weight:750;font-size:14px}.field input,.field textarea,.field select,.answer-input{width:100%;border:1px solid #cddbd7;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus,.answer-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #087f7018}.field textarea{min-height:78px;resize:vertical}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.question-card{border:1px solid var(--line);border-radius:15px;padding:16px;margin:14px 0;background:#fbfdfc}.question-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:12px;font-weight:800;padding:5px 9px;border-radius:99px;background:#e5f4ef;color:var(--teal)}.options{display:grid;gap:8px;margin-top:10px}.option{display:flex;align-items:center;gap:9px;border:1px solid var(--line);padding:11px;border-radius:11px;background:#fff}.option input{accent-color:var(--teal);width:18px;height:18px}.notice{padding:12px 14px;border-radius:12px;background:#fff7df;color:#725817;font-size:13px;margin:14px 0}.success{background:#e8f6ed;color:#236342}.hidden{display:none!important}.student-shell{max-width:760px;margin:28px auto;padding:0 16px}.student-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.progress{height:7px;background:#e5eeeb;border-radius:20px;overflow:hidden;margin:15px 0}.progress div{height:100%;background:var(--teal);width:0}.student-question{font-size:23px;line-height:1.25;font-weight:800;margin:18px 0}.answerbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.student-option{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;margin:9px 0;background:#fff}.student-option input{width:19px;height:19px;accent-color:var(--teal)}.student-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.timer{font-weight:850;color:var(--teal);background:#e8f5f1;padding:7px 12px;border-radius:10px}.tool-fab{position:fixed;right:18px;bottom:20px;z-index:20}.toolbox{position:fixed;right:18px;bottom:80px;width:min(300px,calc(100vw - 36px));background:white;border:1px solid var(--line);box-shadow:0 12px 40px #0002;border-radius:16px;padding:15px;z-index:21}.toolbox input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;margin:4px 0}.toolbox .calc-display{text-align:right;font-size:24px;font-weight:800;background:#f2f7f5;padding:10px;border-radius:9px;overflow-wrap:anywhere;min-height:50px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.calc-grid button{padding:10px 0}.result-row{padding:12px 0;border-bottom:1px solid var(--line)}.score{font-size:42px;font-weight:900;color:var(--teal)}.empty{text-align:center;padding:35px;color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.linkbox{background:#f2f8f6;border:1px dashed #9bbdb4;padding:12px;border-radius:12px;overflow-wrap:anywhere}.footer{text-align:center;color:var(--muted);font-size:12px;padding:35px 12px}
@media(max-width:720px){.grid,.grid3{grid-template-columns:1fr}.wrap{margin:18px auto}.hero{align-items:flex-start;flex-direction:column}.topin{padding:11px 14px}.panel{padding:15px}.student-question{font-size:21px}.student-actions button{flex:1}.desktop-only{display:none}}
.corr-option{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;background:#fff;font-size:14px}.corr-option.opt-c{border-color:#7cc4a0;background:#e8f6ed;color:#1d5a3d}.corr-option.opt-w{border-color:#e3a0a5;background:#fff0f0;color:var(--red)}details>summary{list-style:revert}
.toolbox.calc2{padding:0;overflow:hidden;width:min(304px,calc(100vw - 36px));background:#eef4f2}.calc2-head{display:flex;align-items:center;justify-content:space-between;background:var(--teal);color:#fff;padding:9px 14px;font-size:14px}.toolbox .calc2-head .calc2-close{background:transparent;color:#ffffffcc;padding:3px 8px;border-radius:7px;font-size:14px}.calc2-close:hover{background:#ffffff33;color:#fff}.calc2-screen{margin:12px 12px 0;background:#12201e;border-radius:12px;padding:10px 14px;text-align:right}.calc2-preview{min-height:20px;font-size:14px;color:#7fd6c7}.calc2-preview.err{color:#ff8f8f}.calc2-display{margin-top:2px;min-height:38px;font-size:30px;font-weight:700;color:#fff;white-space:nowrap;overflow-x:auto;scrollbar-width:none}.calc2-display::-webkit-scrollbar{display:none}.calc2-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}.calc2-btn{height:48px;padding:0;border-radius:12px;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s}.calc2-btn:active,.calc2-btn.flash{transform:scale(.94)}.calc2-btn.flash{box-shadow:0 0 0 2px var(--teal2)}.calc2-num{background:#fff;color:var(--ink);border:1px solid var(--line)}.calc2-op{background:#dcefea;color:var(--teal)}.calc2-clear{background:#fde4e4;color:var(--red)}.calc2-back{background:#fdf0d0;color:#8a5a00}.calc2-eq{background:var(--teal);color:#fff}.calc2-hint{margin:0;padding:0 12px 12px;text-align:center;font-size:11px;color:var(--muted)}
.q-img{display:flex;justify-content:center;margin:14px 0}.q-img img{display:block;max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
.student-option.locked{opacity:.62;background:#eef2f1;cursor:not-allowed}.student-option.locked input,.student-option.locked span{cursor:not-allowed}.answer-input:disabled{background:#eef2f1;color:#55625f;cursor:not-allowed}.lock-note{margin-top:12px;font-size:13px;color:var(--muted);background:#f1f4f3;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.qprev{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:14px;margin-top:8px}.qprev .student-question{font-size:18px;margin:10px 0}.qprev .answerbox{padding:12px}.qprev .student-option{padding:9px;margin:6px 0}
.img-slot.active{display:flex;justify-content:center;margin:10px 0;padding:8px;border:2px solid var(--teal);border-radius:12px;cursor:grab;background:#e8f5f1}.img-slot.active img{display:block;max-width:100%;height:auto;border-radius:8px;pointer-events:none}.img-slot.ghost{border:2px dashed #9bbdb4;border-radius:12px;padding:9px;text-align:center;color:var(--teal);font-size:13px;font-weight:700;margin:8px 0;cursor:pointer;background:#fff}.img-slot.ghost:hover,.img-slot.ghost.over{background:#e8f5f1;border-color:var(--teal)}
.file-btn{display:inline-block;padding:7px 10px;border-radius:9px;background:#e7f2ef;color:var(--teal);font-weight:700;font-size:13px;cursor:pointer}.file-btn:hover{filter:brightness(.97)}
</style>

<body>
<header class="top"><div class="topin"><div class="brand">Classe<span>QCM</span></div><div class="row"><span class="tiny desktop-only">La plateforme de QCM pour les enseignants</span><button class="secondary small" onclick="goHome()">Accueil</button></div></div></header>
<main id="app"></main>
<footer class="footer">ClasseQCM · Synchronisation Firebase · Les accès sont protégés par les règles de la base.</footer>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAviiDdXz71Jr0XxHpuQJWKgEiQzlR5gRs",
  authDomain: "flashmail-5650b.firebaseapp.com",
  databaseURL: "https://flashmail-5650b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "flashmail-5650b",
  storageBucket: "flashmail-5650b.firebasestorage.app",
  messagingSenderId: "356335559074",
  appId: "1:356335559074:web:6f580cbcef71d807aa92fb"
};
firebase.initializeApp(firebaseConfig);
const fbAuth=firebase.auth(), fbDb=firebase.database();
let fbUser=null, cloudReady=false;
fbAuth.onAuthStateChanged(user=>{fbUser=user;cloudReady=true;if(location.hash)route();else renderHome();if(user&&!user.isAnonymous){loadTeacherQuizzes().then(()=>{if(fbUser&&fbUser.uid===user.uid&&!location.hash)renderHome()}).catch(e=>{console.error('Chargement des QCM:',e);const el=document.getElementById('quizList');if(el)el.innerHTML='<div class="notice">Compte connecté. La synchronisation des QCM a échoué : '+esc(authMessage(e))+'</div>'})}});
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DB='classeqcm_v1'; let state=load(), current=null, attempt={}, timerId=null, seconds=0, locked={}, preview=false, toolOpen=false;
let calcExpr='', calcDone=false, calcError='';
function load(){try{return JSON.parse(localStorage.getItem(DB))||{quizzes:[],results:[]}}catch(e){return{quizzes:[],results:[]}}}
function save(){try{localStorage.setItem(DB,JSON.stringify(state))}catch(e){console.warn('Sauvegarde locale impossible (espace plein ?)',e)}}
const normName=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function sameStudent(a,b){return normName(a.first)===normName(b.first)&&normName(a.last)===normName(b.last)&&normName(a.klass)===normName(b.klass)}
function quizResults(id){const q=state.quizzes.find(x=>x.id===id),rs=state.results.filter(r=>r.quizId===id);if(!q||!q.bestOnly)return rs;const m=new Map();rs.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(r=>{const k=[r.first,r.last,r.klass].map(normName).join('|'),e=m.get(k);if(!e)m.set(k,{best:r,n:1});else{e.n++;if(r.score>e.best.score)e.best=r}});return [...m.values()].map(e=>({...e.best,_tries:e.n}))}
function uid(){return Math.random().toString(36).slice(2,9)}
function goHome(){stopTimer();renderHome()}
function renderHome(){
 $('#app').innerHTML=`<div class="wrap"><div class="hero"><div><h1>Les évaluations, en plus simple.</h1><div class="muted">Crée un QCM, partage un lien et retrouve les résultats par élève et par classe.</div></div><button onclick="newQuiz()">＋ Créer un QCM</button></div>
 <div class="grid"><section class="panel"><h2>Espace professeur</h2><p class="muted">Connecte-toi pour retrouver tes QCM et consulter les résultats sur tous tes appareils.</p>${fbUser&&!fbUser.isAnonymous?`<p class="tiny success">Connecté : ${esc(fbUser.email||'professeur')}</p><button onclick="newQuiz()">＋ Créer un QCM</button> <button class="ghost small" onclick="teacherLogout()">Déconnexion</button>`:`<button onclick="teacherAccess()">Connexion / créer un compte professeur</button>`}</section><section class="panel"><h2>Rejoindre un QCM</h2><p class="muted">Un élève peut ouvrir directement le lien reçu de son professeur.</p><div class="field"><label>Code du QCM</label><input id="joinCode" placeholder="Ex. ab12cd3"></div><button class="secondary" onclick="joinByCode()">Rejoindre</button></section></div>
 <div class="row between" style="margin:28px 0 12px"><h2>Mes QCM</h2><span class="tiny">${fbUser&&!fbUser.isAnonymous?state.quizzes.length:0} QCM synchronisé(s)</span></div>
 <div id="quizList">${fbUser&&!fbUser.isAnonymous&&state.quizzes.length?state.quizzes.map(q=>`<div class="card" style="margin:10px 0"><div class="row between"><div><b>${esc(q.title)}</b><div class="tiny">${q.questions.length} question(s) · ${q.attempts===0?'Tentatives illimitées':q.attempts+' tentative(s)'} · ${q.duration? q.duration+' min':'Sans limite de temps'}</div></div><span class="pill">${q.code}</span></div><div class="row" style="margin-top:13px"><button class="small" onclick="editQuiz('${q.id}')">Modifier</button><button class="small secondary" onclick="showLinks('${q.id}')">Liens</button><button class="small secondary" onclick="showResults('${q.id}')">Résultats</button><button class="small ghost" onclick="previewQuiz('${q.id}')">Tester</button><button class="small danger" onclick="deleteQuiz('${q.id}')">Supprimer</button></div></div>`).join(''):'<div class="empty">Aucun QCM pour le moment. Crée ton premier QCM !</div>'}</div></div>`;
}
function newQuiz(){if(!fbUser||fbUser.isAnonymous){teacherAccess();return}current={id:uid(),code:uid(),title:'Nouveau QCM',description:'',duration:0,attempts:0,showCorrection:true,showScore:true,calculator:false,bestOnly:false,questions:[makeQuestion()]};renderEditor()}
function makeQuestion(){return{id:uid(),type:'single',text:'',options:['',''],correct:[0],answer:'',points:1,image:'',imagePos:'middle',imageW:70}}
function editQuiz(id){current=state.quizzes.find(q=>q.id===id);renderEditor()}
function renderEditor(){
 const q=current;
 $('#app').innerHTML=`<div class="wrap"><div class="hero"><div><h1>Créateur de QCM</h1><div class="muted">Configure ton évaluation et ajoute autant de questions que nécessaire.</div></div><button class="ghost" onclick="goHome()">← Retour</button></div>
 <section class="panel"><div class="grid"><div class="field"><label>Titre du QCM</label><input id="qtitle" value="${esc(q.title)}" oninput="current.title=this.value"></div><div class="field"><label>Consigne / description</label><input id="qdesc" value="${esc(q.description)}" oninput="current.description=this.value"></div></div>
 <div class="grid3"><div class="field"><label>Durée (minutes, 0 = sans limite)</label><input type="number" min="0" id="duration" value="${q.duration}" oninput="current.duration=Math.max(0,+this.value)"></div><div class="field"><label>Nombre de tentatives</label><input type="number" min="0" id="attempts" value="${q.attempts}" oninput="current.attempts=Math.max(0,+this.value)"><span class="tiny">0 = tentatives à l'infini. Au-delà du maximum, l'élève peut refaire le QCM mais sa note n'est plus envoyée.</span></div><div class="field"><label>Outils disponibles</label><label class="option"><input type="checkbox" ${q.calculator?'checked':''} onchange="current.calculator=this.checked"> Calculatrice intégrée</label></div></div>
 <div class="row"><label class="option"><input type="checkbox" ${q.showCorrection?'checked':''} onchange="current.showCorrection=this.checked"> Afficher le corrigé à la fin</label><label class="option"><input type="checkbox" ${q.showScore?'checked':''} onchange="current.showScore=this.checked"> Afficher le score final</label></div>
 <div class="notice">Astuce : le type « réponse libre » permet une correction manuelle par le professeur. Les réponses à choix sont corrigées automatiquement.</div></section>
 <div class="row between" style="margin:25px 0 8px"><h2>Questions <span class="pill">${q.questions.length}</span></h2><button onclick="addQuestion()">＋ Ajouter une question</button></div>
 <div id="questions">${q.questions.map((x,i)=>questionEditor(x,i)).join('')}</div>
 <section class="panel" style="margin-top:20px"><h2 style="margin:0 0 10px">Option finale</h2><label class="option"><input type="checkbox" ${q.bestOnly?'checked':''} onchange="current.bestOnly=this.checked"> Garder uniquement la meilleure note de chaque élève</label><div class="tiny" style="margin-top:8px">Si un élève refait le QCM, seule sa meilleure note apparaît dans les résultats et dans l'export CSV.</div></section>
  <div class="row between" style="margin-top:20px"><button class="ghost" onclick="previewQuiz(current.id,true)">Tester la vue élève</button><button onclick="saveQuiz()">Enregistrer le QCM</button></div></div>`;
}
function questionEditor(x,i){return `<div class="question-card"><div class="question-head"><b>Question ${i+1}</b><div class="row"><span class="pill">${x.points} pt(s)</span><button class="small danger" onclick="removeQuestion('${x.id}')">Supprimer</button></div></div>
 <div class="field"><label>Énoncé</label><textarea oninput="setQuestion('${x.id}','text',this.value)" placeholder="Écris ta question…">${esc(x.text)}</textarea></div>
 <div class="grid"><div class="field"><label>Type de réponse</label><select onchange="changeType('${x.id}',this.value)"><option value="single" ${x.type==='single'?'selected':''}>Choix unique</option><option value="multiple" ${x.type==='multiple'?'selected':''}>Choix multiples</option><option value="text" ${x.type==='text'?'selected':''}>Réponse libre (texte)</option><option value="number" ${x.type==='number'?'selected':''}>Réponse numérique</option></select></div><div class="field"><label>Points</label><input type="number" min="0.5" step="0.5" value="${x.points}" onchange="setQuestion('${x.id}','points',Math.max(0.5,+this.value||1));renderEditor()"></div></div>
 ${x.type==='text'||x.type==='number'?`<div class="field"><label>Réponse attendue (pour la correction automatique)</label><input value="${esc(x.answer)}" oninput="setQuestion('${x.id}','answer',this.value)" placeholder="Réponse attendue"></div>`:`<label><b>Propositions</b> <span class="tiny">Coche la/les bonne(s) réponse(s).</span></label>${x.options.map((o,j)=>`<div class="row" style="margin:7px 0"><input style="accent-color:var(--teal);width:19px;height:19px" type="${x.type==='multiple'?'checkbox':'radio'}" name="correct_${x.id}" ${x.correct.includes(j)?'checked':''} onchange="toggleCorrect('${x.id}',${j},this.checked)"><input class="answer-input" value="${esc(o)}" placeholder="Proposition ${j+1}" oninput="setOption('${x.id}',${j},this.value)"><button class="small danger" onclick="removeOption('${x.id}',${j})">×</button></div>`).join('')}<button class="small secondary" onclick="addOption('${x.id}')">＋ Ajouter une proposition</button>`}
  ${imageEditor(x,i)}
 </div>`}
function setQuestion(id,k,v){let x=current.questions.find(a=>a.id===id);x[k]=v;refreshQPreview(id)}
function imgSrc(x){return typeof x.image==='string'&&/^data:image\//.test(x.image)?esc(x.image):''}
function imgSlot(x,pos,editing){
  if(!imgSrc(x))return '';
  const p=x.imagePos||'middle',w=x.imageW||70;
  if(editing){
    if(p===pos)return `<div class="img-slot active" draggable="true" title="Glisse l'image pour la déplacer" ondragstart="event.dataTransfer.setData('text/plain','img');event.dataTransfer.effectAllowed='move'"><img draggable="false" alt="" src="${imgSrc(x)}" style="width:${w}%"></div>`;
    return `<div class="img-slot ghost" onclick="setImagePos('${x.id}','${pos}')" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();setImagePos('${x.id}','${pos}')">＋ Placer l'image ici</div>`;
  }
  if(p!==pos)return '';
  return `<div class="q-img"><img alt="Illustration de la question" src="${imgSrc(x)}" style="width:${w}%"></div>`;
}
function qPreviewInner(x,i){const total=current.questions.length;return `<div class="row between"><b style="font-size:13px">Question ${i+1} sur ${total}</b><span class="tiny">${x.points} point(s)</span></div>${imgSlot(x,'top',true)}<div class="student-question">${String(x.text||'').trim()?esc(x.text):'<span class="muted">(Énoncé de la question)</span>'}</div>${imgSlot(x,'middle',true)}<div class="answerbox" inert>${renderAnswer(x,undefined,false)}</div>${imgSlot(x,'bottom',true)}`}
function refreshQPreview(id){const el=document.getElementById('qprev_'+id);if(!el||!current||!current.questions)return;const i=current.questions.findIndex(a=>a.id===id);if(i>=0)el.innerHTML=qPreviewInner(current.questions[i],i)}
function imageEditor(x,i){const pos=x.imagePos||'middle',w=x.imageW||70;
  return `<div style="margin-top:16px;border-top:1px dashed var(--line);padding-top:14px"><div class="row between"><b>Image de la question <span class="tiny">(facultatif)</span></b><div class="row"><label class="file-btn">${x.image?"Changer l'image":'＋ Ajouter une image'}<input type="file" accept="image/*" class="hidden" onchange="uploadImage('${x.id}',this)"></label>${x.image?`<button class="small danger" onclick="removeImage('${x.id}')">Retirer l'image</button>`:''}</div></div>
  ${x.image?`<div class="grid" style="margin-top:6px"><div class="field"><label>Emplacement de l'image</label><select id="ipos_${x.id}" onchange="setImagePos('${x.id}',this.value)"><option value="top" ${pos==='top'?'selected':''}>Au-dessus de la consigne</option><option value="middle" ${pos==='middle'?'selected':''}>Entre la consigne et les réponses (par défaut)</option><option value="bottom" ${pos==='bottom'?'selected':''}>Sous les réponses</option></select></div><div class="field"><label>Taille de l'image : <span id="iw_${x.id}">${w}</span> %</label><input type="range" min="15" max="100" step="5" value="${w}" oninput="setQuestion('${x.id}','imageW',+this.value);document.getElementById('iw_${x.id}').textContent=this.value"></div></div>`:''}

const calcPretty=s=>s.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');
function calcFormat(n){if(!isFinite(n))throw new Error('Résultat invalide');return String(parseFloat(n.toPrecision(12)))}
function calcAutoClose(e){const o=(e.match(/\(/g)||[]).length,c=(e.match(/\)/g)||[]).length;return e+')'.repeat(Math.max(0,o-c))}
function calcClean(e){return calcAutoClose(e.replace(/[+\-*/.]+$/,''))}
function calcEval(expr){
  const s=expr.replace(/\s+/g,'');let i=0;
  const peek=()=>s[i];
  function parseExpr(){let v=parseTerm();while(peek()==='+'||peek()==='-'){const op=s[i++],r=parseTerm();v=op==='+'?v+r:v-r}return v}
  function parseTerm(){let v=parseFactor();while(peek()==='*'||peek()==='/'){const op=s[i++],r=parseFactor();if(op==='/'&&r===0)throw new Error('Division par zéro');v=op==='*'?v*r:v/r}return v}
  function parseFactor(){if(peek()==='-'){i++;return -parseFactor()}if(peek()==='+'){i++;return parseFactor()}return parsePrimary()}
  function parsePrimary(){
    if(peek()==='('){i++;const v=parseExpr();if(peek()!==')')throw new Error('Parenthèse manquante');i++;return v}
    const m=/^\d*\.?\d+|^\d+\.?/.exec(s.slice(i));
    if(!m)throw new Error('Expression invalide');
    i+=m[0].length;return parseFloat(m[0]);
  }
  if(!s)throw new Error('Vide');
  const r=parseExpr();
  if(i<s.length)throw new Error('Expression invalide');
  return r;
}
function calculatorHTML(){
  const b=(k,label,cls,title)=>`<button type="button" class="calc2-btn ${cls}" data-k="${k}"${title?` title="${title}" aria-label="${title}"`:''} onmousedown="event.preventDefault()" onclick="calcKey('${k}')">${label}</button>`;
  const back='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m16 9-5 6m0-6 5 6"/></svg>';
  return `<div class="toolbox calc2"><div class="calc2-head"><b>Calculatrice</b><button type="button" class="calc2-close" aria-label="Fermer" onmousedown="event.preventDefault()" onclick="toggleTool()">✕</button></div>
<div class="calc2-screen"><div class="calc2-preview" id="calcPreview"></div><div class="calc2-display" id="calcDisplay" aria-live="polite">${esc(calcExpr?calcPretty(calcExpr):'0')}</div></div>
<div class="calc2-grid">
${b('clear','C','calc2-clear','Tout effacer (Échap)')}${b('(','(','calc2-op')}${b(')',')','calc2-op')}${b('back',back,'calc2-back','Supprimer le dernier chiffre (Retour arrière)')}
${['7','8','9'].map(d=>b(d,d,'calc2-num')).join('')}${b('/','÷','calc2-op')}
${['4','5','6'].map(d=>b(d,d,'calc2-num')).join('')}${b('*','×','calc2-op')}
${['1','2','3'].map(d=>b(d,d,'calc2-num')).join('')}${b('-','−','calc2-op')}
${b('0','0','calc2-num')}${b('.',',','calc2-num')}${b('=','=','calc2-eq')}${b('+','+','calc2-op')}
</div><p class="calc2-hint">Clavier actif : chiffres, + − * /, Entrée, ⌫ pour supprimer</p></div>`;
}
function calcRefresh(){
  const d=document.getElementById('calcDisplay'),p=document.getElementById('calcPreview');
  if(d)d.textContent=calcExpr?calcPretty(calcExpr):'0';
  if(!p)return;
  let txt='',err=false;
  if(calcError){txt=calcError;err=true}
  else if(!calcDone&&calcExpr&&/[+\-*/(]/.test(calcExpr.slice(1))){
    try{txt='= '+calcPretty(calcFormat(calcEval(calcClean(calcExpr))))}catch(e){txt=''}
  }
  p.textContent=txt;p.classList.toggle('err',err);
  if(d)d.scrollLeft=d.scrollWidth;
}
function calcKey(k){
  calcError='';
  const cur=calcExpr,last=cur.slice(-1);
  if(/^\d$/.test(k)){
    if(calcDone){calcExpr=k;calcDone=false}
    else if(last===')')calcExpr=cur+'*'+k;
    else{
      const seg=cur.split(/[+\-*/()]/).pop();
      calcExpr=seg==='0'?cur.slice(0,-1)+k:cur+k;
    }
  }
  else if(k==='.'){
    let base=cur;
    if(calcDone){calcDone=false;base=''}
    const seg=base.split(/[+\-*/()]/).pop()||'';
    if(seg.includes('.'))calcExpr=base;
    else if(seg==='')calcExpr=base+'0.';
    else calcExpr=base+'.';
  }
  else if(CALC_OPS.includes(k)){
    calcDone=false;
    if(cur==='')calcExpr=k==='-'?'-':cur;
    else if(last==='(')calcExpr=k==='-'?cur+'-':cur;
    else if(CALC_OPS.includes(last)){
      if(cur.length===1&&last==='-')calcExpr=cur;
      else calcExpr=cur.slice(0,-1)+k;
    }
    else if(last==='.')calcExpr=cur+'0'+k;
    else calcExpr=cur+k;
  }
  else if(k==='('){
    const wasDone=calcDone;calcDone=false;
    if(wasDone)calcExpr='(';
    else if(/[\d)]/.test(last))calcExpr=cur+'*(';
    else calcExpr=cur+'(';
  }
  else if(k===')'){
    const o=(cur.match(/\(/g)||[]).length,c=(cur.match(/\)/g)||[]).length;
    if(o>c&&/[\d)]/.test(last))calcExpr=cur+')';
  }
  else if(k==='back'){
    calcDone=false;
    calcExpr=cur.slice(0,-1);
  }
  else if(k==='clear'){
    calcDone=false;
    calcExpr='';
  }
  else if(k==='='){
    if(cur&&!calcDone){
      try{
        calcExpr=calcFormat(calcEval(calcClean(cur)));
        calcDone=true;
      }catch(err){calcError=err&&err.message?err.message:'Erreur'}
    }
  }
  calcRefresh();
}
function calcFlash(k){
  const el=document.querySelector('.toolbox [data-k="'+k+'"]');
  if(!el)return;
  el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),120);
}
/* Saisie au clavier : active seulement quand la calculatrice est ouverte */
document.addEventListener('keydown',e=>{
  if(!toolOpen||!current||!current.calculator||!document.querySelector('.toolbox'))return;
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;let m=null;
  if(/^\d$/.test(k))m=k;
  else if(k==='.'||k===',')m='.';
  else if(k==='+'||k==='-'||k==='*'||k==='/')m=k;
  else if(k==='x'||k==='X')m='*';
  else if(k==='('||k===')')m=k;
  else if(k==='Enter'||k==='=')m='=';
  else if(k==='Backspace')m='back';
  else if(k==='Delete'||k==='Escape'||k==='c'||k==='C')m='clear';
  if(m){
    e.preventDefault();
    if(t&&t.tagName==='BUTTON')t.blur();
    calcFlash(m);
    calcKey(m);
  }
});
async function showResultsByCode(code){if(!fbAuth.currentUser||fbAuth.currentUser.isAnonymous){teacherAccess();return}try{const snap=await fbDb.ref('teacherQuizzes/'+fbAuth.currentUser.uid+'/'+code).once('value');if(!snap.exists()){$('#app').innerHTML='<div class="wrap"><div class="panel">Ce lien de résultats est réservé au compte professeur propriétaire du QCM. <button onclick="goHome()">Accueil</button></div></div>';return}const qs=await fbDb.ref('quizzes/'+code).once('value'),q=qs.val();if(!q){$('#app').innerHTML='<div class="wrap">QCM introuvable.</div>';return}if(!state.quizzes.some(x=>x.code===code))state.quizzes.push(q);showResults(q.id)}catch(e){$('#app').innerHTML='<div class="wrap"><div class="panel">Impossible de charger les résultats : '+esc(authMessage(e))+' <button onclick="goHome()">Accueil</button></div></div>'}}
async function route(){let h=location.hash;if(h.startsWith('#faire=')){let code=h.split('=')[1];try{let snap=await fbDb.ref('quizzes/'+code).once('value'),q=snap.val();if(q)startStudent(q);else $('#app').innerHTML='<div class="wrap"><div class="panel">Ce QCM est introuvable. Vérifie le lien.</div></div>'}catch(e){$('#app').innerHTML='<div class="wrap"><div class="panel">Erreur de chargement : '+esc(e.message)+'</div></div>'}}else if(h.startsWith('#resultats='))showResultsByCode(h.split('=')[1]);else renderHome()}
async function teacherAccess(){ $('#app').innerHTML=`<div class="student-shell"><div class="panel"><div class="brand">Classe<span>QCM</span></div><h1>Espace professeur</h1><p class="muted">Connecte-toi ou crée ton compte professeur. Les élèves, eux, n'ont pas besoin de compte.</p><div class="field"><label>Adresse e-mail</label><input id="teacherEmail" type="email" autocomplete="email" placeholder="professeur@exemple.fr"></div><div class="field"><label>Mot de passe</label><input id="teacherPassword" type="password" autocomplete="current-password" placeholder="6 caractères minimum"></div><div class="row"><button id="loginBtn" onclick="teacherLogin()">Se connecter</button><button id="registerBtn" class="secondary" onclick="teacherRegister()">Créer mon compte</button></div><button class="ghost small" onclick="teacherResetPassword()">Mot de passe oublié ?</button><p id="authError" class="tiny" aria-live="polite"></p><button class="ghost small" style="margin-top:12px" onclick="goHome()">Retour</button></div></div>`}
function authError(message){const el=$('#authError');if(el)el.textContent=message}
function authBusy(busy){['loginBtn','registerBtn'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=busy})}
function validTeacherCredentials(){const email=$('#teacherEmail')?.value.trim()||'',password=$('#teacherPassword')?.value||'';if(!email){authError('Saisis ton adresse e-mail.');return null}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){authError('Vérifie le format de ton adresse e-mail.');return null}if(!password){authError('Saisis ton mot de passe.');return null}return {email,password}}
async function teacherLogin(){const data=validTeacherCredentials();if(!data)return;authBusy(true);authError('Connexion en cours…');try{const credential=await fbAuth.signInWithEmailAndPassword(data.email,data.password);fbUser=credential.user;renderHome();loadTeacherQuizzes().then(()=>{if(fbUser&&fbUser.uid===credential.user.uid&&!location.hash)renderHome()}).catch(e=>{console.error('Synchronisation après connexion:',e);const el=document.getElementById('quizList');if(el)el.innerHTML='<div class="notice">Connecté, mais impossible de synchroniser les QCM : '+esc(authMessage(e))+'</div>'})}catch(e){authError(authMessage(e))}finally{authBusy(false)}}
async function teacherRegister(){const data=validTeacherCredentials();if(!data)return;if(data.password.length<6){authError('Le mot de passe doit contenir au moins 6 caractères.');return}authBusy(true);authError('Création du compte en cours…');let timeoutId;try{const creation=fbAuth.createUserWithEmailAndPassword(data.email,data.password);const timeout=new Promise((_,reject)=>{timeoutId=setTimeout(()=>reject(Object.assign(new Error('Firebase ne répond pas. Vérifie ta connexion Internet et la configuration de la méthode E-mail/Mot de passe dans Firebase Authentication.'),{code:'auth/timeout'})),20000)});const credential=await Promise.race([creation,timeout]);clearTimeout(timeoutId);fbUser=credential.user;authError('Compte créé avec succès !');renderHome();loadTeacherQuizzes().then(()=>{if(fbUser&&fbUser.uid===credential.user.uid&&!location.hash)renderHome()}).catch(e=>{console.error('Synchronisation après inscription:',e);authError('Compte créé, mais la synchronisation des QCM a échoué : '+authMessage(e))})}catch(e){clearTimeout(timeoutId);authError(e.code==='auth/timeout'?e.message:authMessage(e))}finally{authBusy(false)}}
async function teacherResetPassword(){const email=$('#teacherEmail')?.value.trim()||'';if(!email){authError('Saisis ton adresse e-mail pour recevoir le lien de réinitialisation.');return}try{await fbAuth.sendPasswordResetEmail(email);authError('E-mail envoyé si cette adresse correspond à un compte. Vérifie ta boîte de réception et tes courriers indésirables.')}catch(e){authError(authMessage(e))}}
function authMessage(e){const messages={'auth/email-already-in-use':'Cette adresse possède déjà un compte. Connecte-toi.','auth/invalid-email':'Adresse e-mail invalide.','auth/weak-password':'Mot de passe trop faible : utilise au moins 6 caractères.','auth/user-not-found':'Aucun compte trouvé avec cette adresse.','auth/wrong-password':'Mot de passe incorrect.','auth/invalid-credential':'Adresse e-mail ou mot de passe incorrect.','auth/too-many-requests':'Trop de tentatives. Réessaie plus tard.','auth/network-request-failed':'Problème de connexion Internet. Réessaie.','auth/operation-not-allowed':'La connexion par e-mail/mot de passe n’est pas activée dans Firebase Authentication.','auth/email-not-verified':'Confirme ton adresse e-mail si la vérification est activée.','auth/timeout':'Firebase ne répond pas après 20 secondes. Vérifie la connexion Internet et que E-mail/Mot de passe est activé dans Firebase Authentication.'};return messages[e.code]||e.message||'Une erreur inconnue est survenue.'}
async function loadTeacherQuizzes(){const user=fbAuth.currentUser;if(!user||user.isAnonymous)return;const snap=await fbDb.ref('teacherQuizzes/'+user.uid).once('value'),codes=snap.val()||{},loaded=[];for(const code of Object.keys(codes)){const q=await fbDb.ref('quizzes/'+code).once('value');if(q.exists())loaded.push(q.val())}state.quizzes=loaded;save()}
async function teacherLogout(){try{await fbAuth.signOut();state.quizzes=[];renderHome()}catch(e){alert('Déconnexion impossible : '+authMessage(e))}}
</script>
